    // allFeaturesByCode + cityKeyByTownCode から市区町村レイヤーを再構築する
    // （元のfetchをやり直さず、共有キャッシュから復元した内容だけで完結する）。
    // ①と同じく、実際にLeafletレイヤーを構築するのは表示ON（cityVisibility）の市区町村だけにする
    // （キャッシュにはCSV自動読込等で取得済みの非表示市区町村分も含まれうるため、それらは
    // cityTownCodesだけ復元しておき、レイヤー自体はユーザーが後でトグルONにした時に構築する）
    async function rebuildCityLayersFromCache() {
      const cityFeatMap = {};
      for (const [townCode, features] of Object.entries(allFeaturesByCode)) {
        const key = cityKeyByTownCode[townCode];
        if (!key) continue;
        (cityFeatMap[key] || (cityFeatMap[key] = [])).push(...features);
        (cityTownCodes[key] || (cityTownCodes[key] = [])).push(townCode);
      }
      let processed = 0;
      for (const [key, features] of Object.entries(cityFeatMap)) {
        if (!csvMode && cityVisibility[key]) {
          const layer = buildCityGeoJSONLayer(features);
          layer.addTo(map);
          cityGroups[key] = layer;
        }
        processed++;
        if (processed % 20 === 0) await yieldToUI();
      }
    }

    async function loadFromSlot(name) {
      const pb = document.getElementById('progress-bar'), pf = document.getElementById('progress-fill');
      pb.style.display = 'block'; pf.style.width = '5%';
      try {
        const record = await idbGet('slots', slotId(getSaveNamespace(), name));
        if (!record) { alert('セーブデータが見つかりませんでした。'); return; }

        resetAllStateForRestore();
        pf.style.width = '15%';

        // --- GPX/端末データ ---
        // JSON.parse自体は分割できないため、その前後でブラウザに制御を戻し、
        // 続く重い処理（下記のinitMapLayers等）は各関数内部でチャンク分割してawaitする。
        GPX_DATA = JSON.parse(await gunzipToString(record.gpxBlob));
        DEVICES = record.devices.DEVICES;
        visibility = record.devices.visibility;
        modelColorMap = record.devices.modelColorMap;
        nextColorIdx = record.devices.nextColorIdx;
        nextDeviceSeq = record.devices.nextDeviceSeq;
        loadedKeys = new Set(record.devices.loadedKeysArr);
        for (let i = 0; i < DEVICES.length; i++) {
          const dev = DEVICES[i];
          GPX_SPEEDS[dev.key] = calcSpeeds(GPX_DATA[dev.key] || []);
          GPX_AVG_SPEED[dev.key] = computeTrajectoryAvgSpeed(GPX_DATA[dev.key] || []);
          if (i % 10 === 0) await yieldToUI();
        }
        buildGroups();
        pf.style.width = '30%';
        await yieldToUI();

        await initMapLayers();
        document.getElementById('trackBtn').textContent = DEVICES.length ? '🗜 GPXデータを追加する' : '🗜 GPXデータ読み込み';
        if (DEVICES.length) document.getElementById('trackGroup').classList.add('loaded');
        pf.style.width = '55%';

        // --- 境界/住所コードデータ（共有キャッシュから復元、ZIP/CSVの再読込・再パースなし） ---
        csvMode = record.geo.csvMode;
        cityVisibility = record.geo.cityVisibility || {};
        townVisibility = record.geo.townVisibility || {};
        if (record.geo.fingerprint) {
          const cacheEntry = await idbGet('geoCache', record.geo.fingerprint);
          if (cacheEntry) {
            const content = JSON.parse(await gunzipToString(cacheEntry.blob));
            allFeaturesByCode = content.allFeaturesByCode;
            cityKeyByTownCode = content.cityKeyByTownCode;
            townSetaiByCode = content.townSetaiByCode;
            cityNames = content.cityNames;
            cityCodes = content.cityCodes;
            cityPrefCodes = content.cityPrefCodes;
            citySetai = content.citySetai;
            loadedPrefCodes = new Set(content.loadedPrefCodesArr);
            autoPrefCodes = new Set(content.autoPrefCodesArr || []);
            boundaryFeatureCount = content.boundaryFeatureCount;
            csvTowns = content.csvTowns;
            pf.style.width = '65%';
            await yieldToUI();

            // 境界データ（市区町村ポリゴン）が実際にある場合のみレイヤー再構築・関連UIを有効化する
            // （住所コードCSVのみ読み込み・境界データ未読み込みという組み合わせも元アプリの仕様上あり得るため）
            if (boundaryFeatureCount > 0) {
              await rebuildCityLayersFromCache();
              buildTownSpatialIndex();
              document.getElementById('restDurationRow').style.display = '';
              document.getElementById('secPerUnitRow').style.display = '';
              document.getElementById('transitSpeedRow').style.display = '';
            }
            pf.style.width = '80%';

            if (csvMode) {
              boundaryLevel = 'town';
              townStageFromCSV = true;
              document.getElementById('boundarySectionTitle').textContent = '住所コード';
              document.getElementById('cityFilterInput').placeholder = '町丁目名で絞り込み';
              document.getElementById('csvReportGroup').classList.add('loaded');
              document.getElementById('csvReportBtn').classList.add('active');
              if (boundaryFeatureCount > 0) await applyCSVFilter();
            } else if (boundaryFeatureCount > 0) {
              boundaryLevel = 'city';
              document.getElementById('boundarySectionTitle').textContent = '境界設定（市区町村）';
              document.getElementById('cityFilterInput').placeholder = '市区町村で絞り込み';
              document.getElementById('cityCount').textContent = `${Object.keys(cityNames).length}市区町村`;
            }
          }
        }
        pf.style.width = '88%';

        // --- UI状態 ---
        const ui = record.ui;
        filterText = ui.filterText; cityFilterText = ui.cityFilterText; townFilterText = ui.townFilterText;
        groupExpanded = ui.groupExpanded || {};
        document.documentElement.style.setProperty('--sidebar-w', ui.sidebarW + 'px');
        document.documentElement.style.setProperty('--city-pane-h', ui.cityPaneH + 'px');
        document.getElementById('cityFilterInput').value = csvMode ? townFilterText : cityFilterText;

        document.getElementById('fillOpacitySlider').value = ui.cityFillOpacityPercent;
        onFillOpacity(ui.cityFillOpacityPercent);

        secPerUnit = ui.secPerUnit; restExcludeMinutes = ui.restExcludeMinutes; transitSpeedKmh = ui.transitSpeedKmh;
        document.getElementById('secPerUnitSlider').value = secPerUnit;
        document.getElementById('secPerUnitVal').textContent = secPerUnit + '秒';
        document.getElementById('restDurationSlider').value = restExcludeMinutes;
        document.getElementById('restDurationVal').textContent = restExcludeMinutes + '分';
        document.getElementById('transitSpeedSlider').value = transitSpeedKmh;
        document.getElementById('transitSpeedVal').textContent = transitSpeedKmh + 'km/h';

        rateHeatmapVisible = !!ui.rateHeatmapVisible;
        rateAutoShown = !!ui.rateAutoShown;
        document.getElementById('rateHeatmapToggleBtn').classList.toggle('active', rateHeatmapVisible);

        if (record.mapView.aerialMode !== aerialMode) toggleAerial();

        await yieldToUI();
        await computeVisitEstimates();
        render();
        map.setView([record.mapView.lat, record.mapView.lng], record.mapView.zoom, { animate: false });
        map.invalidateSize();
        pf.style.width = '100%';
      } finally {
        setTimeout(() => { pb.style.display = 'none'; pf.style.width = '0%'; }, 400);
      }
    }

    // ----- セーブ/ロードモーダル -----
    let slModalMode = 'save'; // 'save' | 'load'

    function fmtSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }
    function fmtSavedAt(ms) {
      const d = new Date(ms), z = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${z(d.getMonth() + 1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
    }

    async function renderSaveLoadModal() {
      const list = document.getElementById('slModalList');
      list.innerHTML = '<div class="sl-empty">読み込み中...</div>';
      const slots = await listSlots();
      list.innerHTML = '';
      if (!slots.length) {
        list.innerHTML = `<div class="sl-empty">まだ保存されたデータはありません${slModalMode === 'load' ? '<br>先に「保存」してください' : ''}</div>`;
        return;
      }
      slots.forEach(slot => {
        const row = document.createElement('div');
        row.className = 'sl-row';
        const info = document.createElement('div');
        info.className = 'sl-info';
        const safeName = slot.name.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        info.innerHTML = `<div class="sl-name">${safeName}</div>` +
          `<div class="sl-meta">${fmtSavedAt(slot.savedAt)}　端末${slot.devices.DEVICES.length}件　${fmtSize(slot.sizeBytes)}</div>`;
        row.appendChild(info);
        const del = document.createElement('button');
        del.className = 'sl-del';
        del.textContent = '削除';
        del.addEventListener('click', async e => {
          e.stopPropagation();
          if (!confirm(`「${slot.name}」を削除しますか？`)) return;
          await deleteSlot(slot.name);
          renderSaveLoadModal();
        });
        row.appendChild(del);
        row.addEventListener('click', () => {
          if (slModalMode === 'save') {
            if (!confirm(`「${slot.name}」に上書き保存しますか？`)) return;
            doSave(slot.name);
          } else {
            if (!confirm(`「${slot.name}」を再開しますか？現在の表示内容は置き換わります。`)) return;
            closeSaveLoadModal();
            doLoad(slot.name);
          }
        });
        list.appendChild(row);
      });
    }

    async function doSave(name) {
      name = (name || '').trim();
      if (!name) return;
      const btn = document.getElementById('saveBtn');
      btn.style.pointerEvents = 'none';
      btn.textContent = '⏳ 保存中...';
      try {
        await saveToSlot(name);
        closeSaveLoadModal();
        alert(`「${name}」として保存しました。`);
      } catch (e) {
        console.error(e);
        alert(`保存に失敗しました。\n${e.message || e}`);
      } finally {
        btn.textContent = '保存';
        btn.style.pointerEvents = '';
      }
    }

    async function doLoad(name) {
      const btn = document.getElementById('loadBtn');
      btn.style.pointerEvents = 'none';
      btn.textContent = '⏳ 読込中...';
      try {
        await loadFromSlot(name);
      } catch (e) {
        console.error(e);
        alert(`読み込みに失敗しました。\n${e.message || e}`);
      } finally {
        btn.textContent = '再開';
        btn.style.pointerEvents = '';
      }
    }

    function openSaveModal() {
      slModalMode = 'save';
      const ns = getSaveNamespace();
      document.getElementById('slModalTitle').textContent = '保存' + (ns !== 'default' ? `（区分: ${ns}）` : '');
      document.getElementById('slModalDesc').textContent =
        '新しい名前を付けて保存するか、既存のセーブデータをクリックして上書き保存してください。';
      document.getElementById('slNewRow').style.display = 'flex';
      document.getElementById('slNewName').value = '';
      document.getElementById('saveLoadModal').classList.add('show');
      renderSaveLoadModal();
    }

    function openLoadModal() {
      slModalMode = 'load';
      const ns = getSaveNamespace();
      document.getElementById('slModalTitle').textContent = '再開' + (ns !== 'default' ? `（区分: ${ns}）` : '');
      document.getElementById('slModalDesc').textContent = '再開するセーブデータをクリックしてください。';
      document.getElementById('slNewRow').style.display = 'none';
      document.getElementById('saveLoadModal').classList.add('show');
      renderSaveLoadModal();
    }

    function closeSaveLoadModal() {
      document.getElementById('saveLoadModal').classList.remove('show');
    }

    document.getElementById('slCancelBtn').addEventListener('click', closeSaveLoadModal);
    document.getElementById('saveLoadModal').addEventListener('click', e => {
      if (e.target.id === 'saveLoadModal') closeSaveLoadModal();
    });
    document.getElementById('slNewSaveBtn').addEventListener('click', () => {
      doSave(document.getElementById('slNewName').value);
    });
    document.getElementById('slNewName').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('slNewSaveBtn').click();
    });

    // ===== 初期表示 =====
    // 境界設定ペインは常に表示し、起動直後は都道府県トグル一覧を出しておく（データ取得不要ですぐ描画できる）
    renderPrefStage();

    // ===== ヘッダー内ネイティブツールチップの抑制 =====
    // title属性によるブラウザ標準の吹き出しが「保存」「再開」ボタン等に重なりクリックの妨げになるため、
    // ヘッダー上にカーソルがある間は配下要素のtitleを一時的に外し、表示自体を発生させない
    (function suppressHeaderTooltips() {
      const header = document.getElementById('header');
      if (!header) return;
      const titled = () => Array.from(header.querySelectorAll('[title]'));
      header.addEventListener('mouseenter', () => {
        titled().forEach(el => {
          if (el.hasAttribute('title')) {
            el.dataset.titleCache = el.getAttribute('title');
            el.removeAttribute('title');
          }
        });
      });
      header.addEventListener('mouseleave', () => {
        header.querySelectorAll('[data-title-cache]').forEach(el => {
          el.setAttribute('title', el.dataset.titleCache);
          delete el.dataset.titleCache;
        });
      });
    })();
  </script>

  <!-- Service Worker登録 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/GPS_tracker_public_beta/sw.js');
    }
  </script>
