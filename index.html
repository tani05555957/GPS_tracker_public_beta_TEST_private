      // 境界データ（一覧）が読み込まれたので、集計に関わるコントロール類を表示する
      document.getElementById('restDurationRow').style.display = '';
      document.getElementById('secPerUnitRow').style.display = '';
      document.getElementById('transitSpeedRow').style.display = '';
    }

    // 指定した市区町村keyのジオメトリ（allFeaturesByCode等）を取得する。取得済みなら何もしない
    // （cityTownCodes[key]の有無を取得済み判定に使う。一度取得したらセッション中はキャッシュし続け、
    // トグルOFF→ONを繰り返しても再fetchしない）。空間インデックス・集計の再構築は呼び出し側の責任
    // （複数市区町村をまとめて取得する場合に、都度の再構築で重複コストがかからないようにするため）。
    async function ensureCityGeometry(key) {
      if (cityTownCodes[key]) return;
      const prefCode = cityPrefCodes[key];
      const code = cityCodes[key];
      if (!prefCode || !code) return;

      const geojson = await fetchCityGeoJSON(prefCode, code);
      const townCodes = [];
      (geojson.features || []).forEach(f => {
        const townCode = String(f.properties?.KEY_CODE || f.properties?.KEYCODE || '').trim();
        if (!townCode) return;
        (allFeaturesByCode[townCode] || (allFeaturesByCode[townCode] = [])).push(f);
        townSetaiByCode[townCode] = (townSetaiByCode[townCode] || 0) + (parseInt(f.properties?.SETAI, 10) || 0);
        cityKeyByTownCode[townCode] = key;
        townCodes.push(townCode);
      });
      cityTownCodes[key] = townCodes;
      boundaryFeatureCount += (geojson.features || []).length;
    }

    // 市区町村keyのLeafletレイヤーを返す（未構築なら、必要に応じてジオメトリ取得も行った上で構築しキャッシュする）。
    // 市区町村トグルをONにした時だけ呼ばれ、非表示のままの市区町村では構築されない
    // （＝重いPathオブジェクト・イベント登録・ネットワーク取得のいずれも発生しない、が①③の要）。
    async function ensureCityLayer(key) {
      if (cityGroups[key]) return cityGroups[key];

      const isNewFetch = !cityTownCodes[key];
      if (isNewFetch) { cityLoadingKeys.add(key); updateCityList(); }
      try {
        await ensureCityGeometry(key);
      } finally {
        if (isNewFetch) cityLoadingKeys.delete(key);
      }
      if (isNewFetch) {
        // 新規に取得したジオメトリ分だけ空間インデックス・GPS集計を更新する
        buildTownSpatialIndex();
        computeVisitEstimates();
      }

      const townCodes = cityTownCodes[key] || [];
      const features = [];
      townCodes.forEach(tc => { const f = allFeaturesByCode[tc]; if (f) features.push(...f); });
      const layer = buildCityGeoJSONLayer(features);
      cityGroups[key] = layer;
      return layer;
    }

    // 指定した都道府県コード群の境界データ（市区町村レイヤー・町丁目インデックス等）だけを取り除く。
    // 住所コード解除時の自動読込データのクリーンアップ、および都道府県選択モーダルでのチェック解除による
    // 個別解除の両方から呼ばれる純粋なデータ操作（表示更新は呼び出し側の責任）。
    function unloadPrefectures(prefCodesToRemove) {
      Object.keys(cityNames).forEach(key => {
        if (!prefCodesToRemove.has(cityPrefCodes[key])) return;
        const g = cityGroups[key];
        if (g && map.hasLayer(g)) map.removeLayer(g);
        delete cityGroups[key];
        delete cityVisibility[key];
        delete citySetai[key];
        delete cityCodes[key];
        delete cityNames[key];
        delete cityPrefCodes[key];
        delete cityTownCodes[key];
        cityLoadingKeys.delete(key);
      });

      Object.keys(allFeaturesByCode).forEach(code => {
        if (!prefCodesToRemove.has(code.slice(0, 2))) return;
        delete allFeaturesByCode[code];
        delete townSetaiByCode[code];
        delete cityKeyByTownCode[code];
      });

      prefCodesToRemove.forEach(pc => {
        loadedPrefCodes.delete(pc);
        autoPrefCodes.delete(pc);
        fullyFetchedPrefCodes.delete(pc);
      });

      boundaryFeatureCount = Object.values(allFeaturesByCode).reduce((s, arr) => s + arr.length, 0);
      buildTownSpatialIndex();
    }

    // ===== 境界設定ペイン：都道府県トグル表示段階 =====
    // 都道府県は静的な47件の一覧のため、フェッチ不要で常にすぐ表示できる
    // （実際のポリゴン取得は「市区町村を表示する」を押した時点で選択中の県だけ行う）
    function renderPrefStage() {
      const q = cityFilterText.toLowerCase().replace(/\s+/g, '');
      // Object.keys()は'10'〜'47'のような整数形式の文字列キーを昇順で先頭に並べ替えてしまう
      // （'01'〜'09'は非正規形なので挿入順のまま）ため、明示的に文字列ソートして01→47の順に揃える
      const matched = Object.keys(PREF_NAMES).sort().filter(code => !q || PREF_NAMES[code].toLowerCase().includes(q));

      document.getElementById('cityCount').textContent = `${prefSelected.size}件選択`;

      const hdr = document.getElementById('cityListHeader');
      hdr.innerHTML = '<div class="h-toggle"></div><span class="h-name">都道府県名</span>';
      hdr.style.display = 'flex';

      const el = document.getElementById('cityList');
      el.innerHTML = '';
      matched.forEach(code => {
        const on = prefSelected.has(code);
        const row = document.createElement('div');
        row.className = 'city-row';

        const tog = document.createElement('div');
        tog.className = 'city-toggle' + (on ? ' on' : '');

        const nm = document.createElement('span');
        nm.className = 'city-name';
        nm.textContent = PREF_NAMES[code];

        row.appendChild(tog);
        row.appendChild(nm);
        row.addEventListener('click', () => togglePref(code));
        el.appendChild(row);
      });
      if (!el.children.length)
        el.innerHTML = '<div style="padding:8px 12px;font-size:11px;color:var(--text-muted)">該当なし</div>';

      updateBoundaryStepper();
    }

    function togglePref(code) {
      if (prefSelected.has(code)) prefSelected.delete(code); else prefSelected.add(code);
      renderPrefStage();
    }

    // 「全て表示/全て非表示」の都道府県トグル表示段階版（現在の絞り込みに一致する県だけを対象にする）
    function bulkPrefVisibility(show) {
      const q = cityFilterText.toLowerCase().replace(/\s+/g, '');
      Object.keys(PREF_NAMES).forEach(code => {
        if (q && !PREF_NAMES[code].toLowerCase().includes(q)) return;
        if (show) prefSelected.add(code); else prefSelected.delete(code);
      });
      renderPrefStage();
    }

    // 市区町村一覧の絞り込み条件（cityFilterText）に一致するかどうかを判定する（bulkCityVisibilityと共用）
    function cityMatchesFilter(key, q) {
      if (!q) return true;
      const searchText = ((PREF_NAMES[cityPrefCodes[key]] || '') + (cityNames[key] || key)).toLowerCase().replace(/\s+/g, '');
      return searchText.includes(q);
    }

    function updateCityList() {
      const showStats = boundaryFeatureCount > 0;
      document.getElementById('cityCount').textContent = `${Object.keys(cityNames).length}市区町村`;

      const q = cityFilterText.toLowerCase().replace(/\s+/g, '');
      const showPref = loadedPrefCodes.size > 1;
      const matched = Object.keys(cityNames)
        .filter(key => cityMatchesFilter(key, q))
        .map(key => {
          const prefNameFull = PREF_NAMES[cityPrefCodes[key]] || '';
          const cityName = cityNames[key] || key;
          const prefName = showPref ? prefNameFull : '';
          const label = prefName ? `${prefName} ${cityName}` : cityName;
          return { key, label };
        })
        .sort((a, b) => (cityCodes[a.key] || a.key).localeCompare(cityCodes[b.key] || b.key));

      const hdr = document.getElementById('cityListHeader');
      hdr.innerHTML =
        '<div class="h-toggle"></div>' +
        '<span class="h-name">市区町村名</span>' +
        '<span class="h-stat">統計上<br>世帯数</span>' +
        (showStats ? '<span class="h-stat">推定<br>配布数</span><span class="h-stat">充足<br>率</span>' : '');
      hdr.style.display = 'flex';

      const el = document.getElementById('cityList');
      el.innerHTML = '';
      matched.forEach(({ key, label }) => {
        const on = cityVisibility[key];
        const loading = cityLoadingKeys.has(key);
        const setai = citySetai[key] || 0;
        const row = document.createElement('div');
        row.className = 'city-row';

        const tog = document.createElement('div');
        tog.className = 'city-toggle' + (on ? ' on' : '');
        if (!loading) tog.addEventListener('click', () => toggleCity(key, !cityVisibility[key]));

        const nm = document.createElement('span');
        nm.className = 'city-name';
        nm.textContent = (loading ? '⏳ ' : '') + label;

        const ct = document.createElement('span');
        ct.className = 'city-stat';
        ct.title = '統計上世帯数（境界データのSETAIを参照）';
        ct.textContent = setai > 0 ? setai.toLocaleString() : '—';

        row.appendChild(tog);
        row.appendChild(nm);
        row.appendChild(ct);

        if (showStats) {
          const ms = cityDeliveryStats[key];
          const hasHouseholds = ms && ms.households > 0;
          const vs = document.createElement('span');
          vs.className = 'city-stat';
          vs.title = 'GPS滞在クラスタのポイント・イン・ポリゴン集計による推定配布数';
          vs.textContent = hasHouseholds ? ms.visits.toLocaleString() : '—';

          const rt = document.createElement('span');
          rt.className = 'city-stat rate';
          rt.title = 'GPS滞在クラスタのポイント・イン・ポリゴン集計による推定配布数の、配布数(実績)に対する割合';
          rt.textContent = hasHouseholds ? formatRate(ms.rate) : '—';

          row.appendChild(vs);
          row.appendChild(rt);
        }

        el.appendChild(row);
      });
      if (!el.children.length)
        el.innerHTML = '<div style="padding:8px 12px;font-size:11px;color:var(--text-muted)">該当なし</div>';

      updateBoundaryStepper();
    }

    // ===== 境界設定ペイン：3段階（都道府県／市区町村／町丁目）のステッパー制御 =====
    // 現段階で選択中（トグルON）の件数を見て、次の段階のボタンを押せるかどうかを判定する。
    // ルール: 現在の段階のボタンは常に押せない（すでにそこにいるため）。
    // 手前の段階へは常に戻れる。1つ先の段階へは、現在1件以上トグルONの時だけ進める。
    // 2段階以上先（都道府県→町丁目など）へは直接進めない。
    function updateBoundaryStepper() {
      const idx = { pref: 0, city: 1, town: 2 }[boundaryLevel];
      const countAtCurrent = boundaryLevel === 'pref'
        ? prefSelected.size
        : boundaryLevel === 'city'
          ? Object.keys(cityVisibility).filter(k => cityVisibility[k]).length
          : 0;
      const enabledFor = i => i !== idx && (i < idx || (i === idx + 1 && countAtCurrent >= 1));

      const prefBtn = document.getElementById('boundaryStepPrefBtn');
      const cityBtn = document.getElementById('boundaryStepCityBtn');
      const townBtn = document.getElementById('boundaryStepTownBtn');
      prefBtn.disabled = !enabledFor(0);
      cityBtn.disabled = !enabledFor(1);
      townBtn.disabled = !enabledFor(2);
      prefBtn.classList.toggle('active', boundaryLevel === 'pref');
      cityBtn.classList.toggle('active', boundaryLevel === 'city');
      townBtn.classList.toggle('active', boundaryLevel === 'town');
    }

    // ステッパーボタンのクリックハンドラ。段階の飛び越し・現在段階への再遷移はここで弾く
    function goBoundaryStage(target) {
      if (target === boundaryLevel) return;
      // CSV由来の町丁目表示から離れる場合のみ、住所コードのキャンセルと同じ確認を挟む
      if (boundaryLevel === 'town' && target !== 'town' && townStageFromCSV) {
        if (!confirm('住所コードの読み込みをキャンセルしますか？')) return;
      }
      if (target === 'pref') { backToPrefStage(); return; }
      if (target === 'city') {
        if (boundaryLevel === 'pref') advanceToCityStage();
        else if (boundaryLevel === 'town') backToCityStageFromTown();
        return;
      }
      if (target === 'town' && boundaryLevel === 'city') advanceToTownStage();
    }

    // 都道府県トグル表示段階へ入る（都道府県一覧は選択中の状態を読み込み済み都道府県から作り直す）
    function enterPrefStage() {
      boundaryLevel = 'pref';
      prefSelected = new Set(loadedPrefCodes);
      document.getElementById('boundarySectionTitle').textContent = '境界設定（都道府県）';
      document.getElementById('cityFilterInput').placeholder = '都道府県で絞り込み';
      cityFilterText = '';
      document.getElementById('cityFilterInput').value = '';
      renderPrefStage();
    }

    // 市区町村トグル表示段階へ入る（cityNamesは既に選択中の都道府県分だけになっている前提）。
    // 都道府県トグル表示段階で外した分も含め、cityVisibilityの状態通りに地図上のレイヤーを揃え直す
    // （表示ONの市区町村は、まだジオメトリ未取得ならここで取得される＝③の遅延fetchの効果が出る場所）
    async function enterCityStage() {
      boundaryLevel = 'city';
      document.getElementById('boundarySectionTitle').textContent = '境界設定（市区町村）';
      document.getElementById('cityFilterInput').placeholder = '市区町村で絞り込み';
      cityFilterText = '';
      document.getElementById('cityFilterInput').value = '';
      updateCityList();
      await showCityLayersPerVisibility();
      updateCityList();
    }

    function hideAllCityLayers() {
      Object.values(cityGroups).forEach(g => { if (map.hasLayer(g)) map.removeLayer(g); });
    }

    // cityVisibility[key]===trueの市区町村を地図上に揃える。未構築（未fetch）ならensureCityLayerが
    // ジオメトリ取得＋レイヤー構築を行う（①③）。表示中のupdateCityListはensureCityLayer内部で
    // ローディング表示のために呼ばれるため、ここでは完了を待つだけでよい
    async function showCityLayersPerVisibility() {
      const keys = Object.keys(cityNames).filter(key => cityVisibility[key]);
      for (const key of keys) {
        try {
          const g = await ensureCityLayer(key);
          if (!map.hasLayer(g)) g.addTo(map);
        } catch (e) {
          console.error(e);
        }
      }
    }

    // 都道府県トグルで選択中の都道府県だけを読み込み、市区町村トグル表示段階へ進む
    // （2県以上選択されている場合は表示が重くなる旨を確認する）
    async function advanceToCityStage() {
      const selected = [...prefSelected];
      if (!selected.length) return;
      if (selected.length >= 2 &&
        !confirm(`選択した${selected.length}件の都道府県をすべて表示すると、表示が重くなる可能性があります。続行しますか？`)) return;

      const toUnload = new Set([...loadedPrefCodes].filter(c => !prefSelected.has(c)));
      if (toUnload.size) unloadPrefectures(toUnload);

      const toFetch = selected.filter(c => !loadedPrefCodes.has(c));
      if (toFetch.length) {
        const prefBtn = document.getElementById('boundaryStepPrefBtn');
        const cityBtn = document.getElementById('boundaryStepCityBtn');
        const townBtn = document.getElementById('boundaryStepTownBtn');
        const prevLabel = cityBtn.textContent;
        prefBtn.disabled = cityBtn.disabled = townBtn.disabled = true;
        cityBtn.textContent = '⏳ 読み込み中...';
        try {
          for (const prefCode of toFetch) await loadPrefectureByCode(prefCode);
        } finally {
          cityBtn.textContent = prevLabel;
        }
      }

      await enterCityStage();
    }

    // 市区町村または町丁目トグル表示段階から、都道府県トグル表示段階へ戻る
    // （読み込み済みデータ自体は破棄せず、地図上のレイヤーだけを外す。再度進めば再取得なしで即表示できる）
    function backToPrefStage() {
      if (boundaryLevel === 'town') teardownTownStage();
      hideAllCityLayers();
      enterPrefStage();
    }

    // 町丁目トグル表示段階の状態を後片付けする（住所コードCSV由来の自動取得都道府県はここで解除する）
    function teardownTownStage() {
      csvFilterGeneration++; // 実行中のapplyCSVFilter()があれば中断させる
      Object.values(townLayers).forEach(g => { if (map.hasLayer(g)) map.removeLayer(g); });
      townLayers = {};
      csvTowns = [];
      csvMode = false;
      townFilterText = '';
      townVisibility = {};
      townStageFromCSV = false;

      document.getElementById('csvReportGroup').classList.remove('loaded');
      const btn = document.getElementById('csvReportBtn');
      btn.textContent = '📊 住所コード読み込み';
      btn.classList.remove('active');

      if (autoPrefCodes.size) unloadPrefectures(new Set(autoPrefCodes));
    }

    // 町丁目トグル表示段階から、市区町村トグル表示段階へ戻る
    async function backToCityStageFromTown() {
      teardownTownStage();
      await enterCityStage();
      computeVisitEstimates();
    }

    // 表示中（トグルON）の市区町村から町丁目一覧を組み立て、町丁目トグル表示段階へ進む
    // （5市区町村以上を対象にすると表示が重くなるため事前に確認する）
    async function advanceToTownStage() {
      const visibleKeys = Object.keys(cityVisibility).filter(key => cityVisibility[key]);
      if (!visibleKeys.length) return;
      if (visibleKeys.length >= 5 &&
        !confirm(`選択した${visibleKeys.length}件の市区町村をすべて表示すると、表示が重くなる可能性があります。続行しますか？`)) return;

      const keySet = new Set(visibleKeys);
      const towns = [];
      for (const townCode in cityKeyByTownCode) {
        const key = cityKeyByTownCode[townCode];
        if (!keySet.has(key)) continue;
        const feats = allFeaturesByCode[townCode];
        if (!feats || !feats.length) continue;
        const p0 = feats[0].properties || {};
        towns.push({
          code: townCode,
          prefName: PREF_NAMES[cityPrefCodes[key]] || '',
          cityName: cityNames[key] || p0.CITY_NAME || '',
          townName: p0.S_NAME || p0.name || townCode,
          distributionCount: 0,
        });
      }
      if (!towns.length) { alert('指定した市区町村内に町丁目データが見つかりません。'); return; }

      Object.values(townLayers).forEach(g => { if (map.hasLayer(g)) map.removeLayer(g); });
      hideAllCityLayers();

      csvTowns = towns;
      csvMode = true;
      townLayers = {};
      townFilterText = '';
      townVisibility = {};
      csvTowns.forEach(t => { townVisibility[t.code] = true; });
      townStageFromCSV = false;

      boundaryLevel = 'town';
      document.getElementById('boundarySectionTitle').textContent = '境界設定（町丁目）';
      document.getElementById('cityFilterInput').placeholder = '町丁目名で絞り込み';
      document.getElementById('cityFilterInput').value = '';

      applyCSVFilter();

      document.getElementById('csvReportGroup').classList.add('loaded');
      document.getElementById('csvReportBtn').classList.add('active');

      updateBoundaryStepper();
      // 対象範囲(住所コード欄の粒度)が変わるため、配布率を自動的に再集計する
      computeVisitEstimates();
    }

    // 現在地図上に表示中の全レイヤーの外接範囲にfitBoundsする。新規に1件追加した時に、その1件だけの
    // 範囲にズームしてしまうと既存の表示分が画面外に押し出され「追加のはずが表示がリセットされた」ように
    // 見えてしまうため、常にすでに表示中のレイヤーも含めた範囲でフィットする（toggleCity/toggleTown共用）
    function fitBoundsToVisibleLayers(layers) {
      let bounds = null;
      layers.forEach(g => {
        if (!g || !map.hasLayer(g)) return;
        const b = g.getBounds();
        if (!b.isValid()) return;
        bounds = bounds ? bounds.extend(b) : L.latLngBounds(b.getSouthWest(), b.getNorthEast());
      });
      if (bounds && bounds.isValid()) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 17, animate: false });
      }
    }

    // 表示ONにする時だけジオメトリ取得が発生しうる（ensureCityLayer、①③）。取得中の多重クリックは
    // cityLoadingKeysで防ぐ（updateCityList側でも取得中はトグルのクリックハンドラを外している）
    async function toggleCity(key, show) {
      if (cityLoadingKeys.has(key)) return;
      cityVisibility[key] = show;
      if (show) {
        let g;
        try {
          g = await ensureCityLayer(key);
        } catch (e) {
          console.error(e);
          cityVisibility[key] = false;
          alert(`${cityNames[key] || key}の境界データ取得に失敗しました。\nインターネット接続を確認してください。`);
          updateCityList();
          return;
        }
        if (!map.hasLayer(g)) g.addTo(map);
        fitBoundsToVisibleLayers(Object.keys(cityGroups).filter(k => cityVisibility[k]).map(k => cityGroups[k]));
      } else {
        const g = cityGroups[key];
        if (g && map.hasLayer(g)) map.removeLayer(g);
      }
      updateCityList();
    }

    // 「全て表示/全て非表示」は、現在の絞り込み（cityFilterText）に一致する行だけを対象にする
    // （絞り込みで隠れている市区町村の表示状態は変えない）。表示ONにする市区町村は順番にジオメトリを
    // 取得するため（①③）、5件おきにUIへ制御を返してフリーズを防ぐ
    async function bulkCityVisibility(show) {
      if (boundaryLevel === 'pref') { bulkPrefVisibility(show); return; }
      if (csvMode) { bulkTownVisibility(show); return; }
      const q = cityFilterText.toLowerCase().replace(/\s+/g, '');
      const keys = Object.keys(cityNames).filter(key => cityMatchesFilter(key, q));

      if (!show) {
        keys.forEach(key => {
          cityVisibility[key] = false;
          const g = cityGroups[key];
          if (g && map.hasLayer(g)) map.removeLayer(g);
        });
        updateCityList();
        return;
      }

      let processed = 0;
      for (const key of keys) {
        cityVisibility[key] = true;
        try {
          const g = await ensureCityLayer(key);
          if (!map.hasLayer(g)) g.addTo(map);
        } catch (e) {
          console.error(e);
          cityVisibility[key] = false;
        }
        processed++;
        if (processed % 5 === 0) { updateCityList(); await yieldToUI(); }
      }
      updateCityList();
    }

    function onCityFilter(val) {
      if (boundaryLevel === 'pref') { cityFilterText = val; renderPrefStage(); return; }
      if (csvMode) { onTownFilter(val); return; }
      cityFilterText = val; updateCityList();
    }

    function clearCityFilter() {
      const input = document.getElementById('cityFilterInput');
      input.value = '';
      onCityFilter('');
      input.focus();
    }

    let cityFillOpacity = 0.40;

    function onFillOpacity(val) {
      cityFillOpacity = val / 100;
      if (csvMode) {
        Object.values(townLayers).forEach(g => g.setStyle({ fillOpacity: cityFillOpacity }));
      } else {
        Object.values(cityGroups).forEach(g => g.setStyle({ fillOpacity: cityFillOpacity }));
      }
      document.getElementById('fillOpacityVal').textContent = val + '%';
    }

    // ===== メッシュ読み込み・配布率推定 =====
    // 推定配布率ヒートマップの配色（データに依存しない固定グラデーション、起動時に1回だけ構築する）
    function buildRateColorLUT() {
      const stops = [
        [0.00, [49,  54, 149]],
        [0.11, [69, 117, 180]],
        [0.22, [116,173, 209]],
        [0.33, [171,217, 233]],
        [0.44, [224,243, 248]],
        [0.55, [254,224, 144]],
        [0.67, [253,174,  97]],
        [0.78, [244,109,  67]],
        [0.89, [215, 48,  39]],
        [1.00, [165,  0,  38]],
      ];
      const lut = new Array(256);
      for (let i = 0; i < 256; i++) {
        const t = i / 255;
        let r = 165, g = 0, b = 38;
        for (let s = 1; s < stops.length; s++) {
          if (t <= stops[s][0]) {
            const lo = stops[s - 1], hi = stops[s];
            const frac = (t - lo[0]) / (hi[0] - lo[0]);
            r = Math.round(lo[1][0] + frac * (hi[1][0] - lo[1][0]));
            g = Math.round(lo[1][1] + frac * (hi[1][1] - lo[1][1]));
            b = Math.round(lo[1][2] + frac * (hi[1][2] - lo[1][2]));
            break;
          }
        }
        lut[i] = 'rgb(' + r + ',' + g + ',' + b + ')';
      }
      return lut;
    }
    rateColorLUT = buildRateColorLUT();

    // ----- 町丁目ポリゴンの空間インデックス（ポイント・イン・ポリゴン判定の高速化） -----
    // 全町丁目フィーチャをフラット化し、bbox辺長中央値から動的にバケット粒度を決めて登録する
    function buildTownSpatialIndex() {
      townFeatureList = [];
      townSpatialIdx = new Map();
      if (typeof turf === 'undefined') return;

      for (const [code, features] of Object.entries(allFeaturesByCode)) {
        for (const f of features) {
          if (!f.geometry) continue;
          let bbox;
          try { bbox = turf.bbox(f); } catch (e) { continue; }
          townFeatureList.push({ code, geometry: f.geometry, bbox });
        }
      }
      const n = townFeatureList.length;
      if (n === 0) return;

      const stride = Math.max(1, Math.floor(n / TOWN_SIZE_SAMPLE_N));
      const latSizes = [], lonSizes = [];
      for (let i = 0; i < n; i += stride) {
        const b = townFeatureList[i].bbox;
        latSizes.push(b[3] - b[1]);
        lonSizes.push(b[2] - b[0]);
      }
      latSizes.sort((a, b) => a - b);
      lonSizes.sort((a, b) => a - b);
      const medianLat = latSizes[latSizes.length >> 1] || TOWN_BUCKET_MIN_DEG;
      const medianLon = lonSizes[lonSizes.length >> 1] || TOWN_BUCKET_MIN_DEG;
      townBucketLatDeg = Math.min(TOWN_BUCKET_MAX_DEG, Math.max(TOWN_BUCKET_MIN_DEG, medianLat * TOWN_BUCKET_FACTOR));
      townBucketLonDeg = Math.min(TOWN_BUCKET_MAX_DEG, Math.max(TOWN_BUCKET_MIN_DEG, medianLon * TOWN_BUCKET_FACTOR));

      for (let i = 0; i < n; i++) {
        const [minLon, minLat, maxLon, maxLat] = townFeatureList[i].bbox;
        const latB0 = Math.floor(minLat / townBucketLatDeg), latB1 = Math.floor(maxLat / townBucketLatDeg);
        const lonB0 = Math.floor(minLon / townBucketLonDeg), lonB1 = Math.floor(maxLon / townBucketLonDeg);
        for (let la = latB0; la <= latB1; la++) {
          for (let lo = lonB0; lo <= lonB1; lo++) {
            const key = la + ',' + lo;
            let arr = townSpatialIdx.get(key);
            if (!arr) { arr = []; townSpatialIdx.set(key, arr); }
            arr.push(i);
          }
        }
      }
    }

    // 座標(lat,lon)がどの町丁目ポリゴンに入るかを判定し、そのKEY_CODEを返す（該当なしはnull）
    function findTownCodeAt(lat, lon) {
      if (!townSpatialIdx || typeof turf === 'undefined') return null;
      const key = Math.floor(lat / townBucketLatDeg) + ',' + Math.floor(lon / townBucketLonDeg);
      const idxs = townSpatialIdx.get(key);
      if (!idxs) return null;
      const pt = turf.point([lon, lat]);
      for (const i of idxs) {
        const entry = townFeatureList[i];
        const [minLon, minLat, maxLon, maxLat] = entry.bbox;
        if (lat < minLat || lat > maxLat || lon < minLon || lon > maxLon) continue;
        try {
          if (turf.booleanPointInPolygon(pt, entry.geometry)) return entry.code;
        } catch (e) { /* 不正なジオメトリはスキップ */ }
      }
      return null;
    }

    // 推定配布率ヒートマップ（町丁目単位コロプレス）の表示/非表示を切り替える
    function toggleRateHeatmap() {
      rateHeatmapVisible = !rateHeatmapVisible;
      document.getElementById('rateHeatmapToggleBtn').classList.toggle('active', rateHeatmapVisible);
      applyBoundaryColorStyle();
    }

    // 配布率(0-100+%)をヒートマップのカラーLUTと同じ配色スケールに変換する
    // 50%をLUT中央（寒色/暖色の境界）に固定した線形スケール。100%以上は最暖色で飽和させる
    function rateFillColor(rate) {
      if (!rateColorLUT) return '#FFFBBB';
      const t = Math.min(1, Math.max(0, rate / 100));
      return rateColorLUT[Math.round(t * 255)];
    }

    // 境界ポリゴン（市区町村レイヤー/住所コードの町レイヤー）の塗り色を決定する
    // 配布率モード時は町丁目単位の推定配布率でコロプレス表示、それ以外は既定の黄色
    function boundaryStyleFor(code) {
      if (rateHeatmapVisible && boundaryFeatureCount > 0) {
        const stat = townDeliveryStats[code];
        const hasHouseholds = stat && stat.households > 0;
        // 統計上世帯数が0（データなし）の町丁目は按分・実績との比較が成立しないため、
        // ヒートマップ色を付けずグレーにする（黄色だと配布率50%前後に見えてしまうため）
        return {
          fillColor: hasHouseholds ? rateFillColor(stat.rate) : '#1a1a1a',
          fillOpacity: cityFillOpacity, color: '#DBC900', weight: 1.5, opacity: 0.9,
        };
      }
      return { fillColor: '#FFFBBB', fillOpacity: cityFillOpacity, color: '#DBC900', weight: 1.5, opacity: 0.9 };
    }

    function cityFeatureStyle(feature) {
      return boundaryStyleFor(String(feature?.properties?.KEY_CODE || feature?.properties?.KEYCODE || '').trim());
    }

    // 表示中（トグルON）のGPX軌跡が1本でもあるか。境界ポリゴンの町字名ホバーとGPX軌跡ホバーが
    // 競合しないよう、GPXが1本でも表示されていればGPX側の吹き出しを優先し、町字名側は出さない
    function anyTrackVisible() {
      return DEVICES.some(d => visibility[d.key]);
    }

    // 充足率の表示用テキストを組み立てる。内部値（townDeliveryStats・CSVエクスポート）は100%超もそのまま保持するが、
    // UI表示は100%を超えた分を切り捨てて「100.0%」とする
    function formatRate(rate) {
      return Math.min(100, rate).toFixed(1) + '%';
    }

    // 境界ポリゴンのホバー吹き出し用詳細テキスト（市区町村/住所コードの町の両方から使う共通ヘルパー）
    function boundaryFeatureStatDetail(townCode) {
      if (!rateHeatmapVisible) return '';
      const stat = townDeliveryStats[townCode];
      if (!stat) return '';
      const hasHouseholds = stat.households > 0;
      const visitsText = hasHouseholds ? `${stat.visits.toFixed(0)}軒` : '－';
      const rateText = hasHouseholds ? formatRate(stat.rate) : '－';
      return `世帯数 ${stat.households.toFixed(0)}｜配布数 ${visitsText}｜充足率 ${rateText}`;
    }

    // 市区町村単位のGeoJSONレイヤーを構築する（市区町村トグルON時・セーブデータ復元時の両方から呼ばれる共通処理）。
    // フィーチャ（ポリゴン）1枚ごとにmouseover/mousemove/mouseoutを貼ると、町丁目数が多い市区町村で
    // イベント登録コスト・メモリが無視できなくなるため、L.geoJSON（FeatureGroup）はホバーイベントを
    // 子レイヤーからグループへ自動で伝播する（e.layerに実際にホバーしたPathが入る）性質を使い、
    // レイヤーグループ単位に1組だけリスナーを登録する（②のイベント一括化）
    function buildCityGeoJSONLayer(features) {
      const layer = L.geoJSON({ type: 'FeatureCollection', features }, {
        style: cityFeatureStyle, pane: 'boundaryPane', renderer: boundaryCanvasRenderer,
      });
      const labelOf = p => [p.CITY_NAME, p.S_NAME].filter(Boolean).join(' ') || p.name || '';
      layer.on('mouseover', e => {
        const lyr = e.layer;
        const p = lyr.feature?.properties || {};
        const label = labelOf(p);
        const townCode = String(p.KEY_CODE || p.KEYCODE || '').trim();
        if (label && !anyTrackVisible()) {
          _balloonLocked = true;
          showBalloon(null, label, boundaryFeatureStatDetail(townCode), e.originalEvent.clientX, e.originalEvent.clientY, 'cursor', true);
        }
        lyr.setStyle({ fillOpacity: Math.min(1, cityFillOpacity + 0.25), weight: 2.5 });
      });
      layer.on('mousemove', e => {
        const lyr = e.layer;
        const p = lyr.feature?.properties || {};
        const label = labelOf(p);
        if (!label || anyTrackVisible()) return;
        const townCode = String(p.KEY_CODE || p.KEYCODE || '').trim();
        showBalloon(null, label, boundaryFeatureStatDetail(townCode), e.originalEvent.clientX, e.originalEvent.clientY, 'cursor', true);
      });
      layer.on('mouseout', e => {
        const lyr = e.layer;
        const p = lyr.feature?.properties || {};
        if (labelOf(p)) hideBalloon();
        layer.resetStyle(lyr);
      });
      return layer;
    }

    // 表示中の境界レイヤー（市区町村/住所コードの町）の色を現在のモード・集計結果で再適用する
    function applyBoundaryColorStyle() {
      Object.values(cityGroups).forEach(g => {
        g.setStyle(f => boundaryStyleFor(String(f?.properties?.KEY_CODE || f?.properties?.KEYCODE || '').trim()));
      });
      Object.entries(townLayers).forEach(([code, g]) => {
        g.setStyle(() => boundaryStyleFor(code));
      });
    }

    // ----- 立ち寄りクラスタの検出とポイント・イン・ポリゴン集計（メッシュを介さず町丁目ポリゴンへ直接判定する） -----
    // GPX読み込み・境界データ読み込み・CSV読み込み・スライダー確定など、集計に影響する操作のたびに呼ばれる。
    // turf.intersectのような重いジオメトリ演算が無いため、進捗バーや中断制御なしで同期的に完了する。
    async function computeVisitEstimates() {
      townVisitUnits = {};

      if (townSpatialIdx) {
        const radiusKm = clusterRadiusM / 1000;
        let processed = 0;
        for (const key in GPX_DATA) {
          const coords = GPX_DATA[key];
          if (!coords || !coords.length) continue;
          const clusters = computeVisitClusters(coords, radiusKm);
          for (const c of clusters) {
            const dwellSec = Math.max(0, c.dwellMs / 1000);
            const units = Math.max(1, Math.round(dwellSec / secPerUnit)); // 滞在時間を軸数に換算（マンション等の複数軒配達を反映）
            const code = findTownCodeAt(c.lat, c.lon);
            if (code) {
              townVisitUnits[code] = (townVisitUnits[code] || 0) + units * DISTRIBUTION_ESTIMATE_FACTOR;
            }
          }
          processed++;
          if (processed % 3 === 0) await yieldToUI();
        }
      }

      await aggregateTownStats();
    }

    // 世帯密度(戸/km2)から推定配布数の補正係数を求める（DENSITY_CORRECTION_LOW/HIGHの2点をlog10密度で線形補間・外挿し、
    // MIN/MAX_FACTORでクランプする）。密度が不明・0の場合は無補正(1倍)を返す
    function densityCorrectionFactor(densityPerKm2) {
      if (!(densityPerKm2 > 0)) return 1;
      const lo = DENSITY_CORRECTION_LOW, hi = DENSITY_CORRECTION_HIGH;
      const t = (Math.log10(densityPerKm2) - Math.log10(lo.density)) / (Math.log10(hi.density) - Math.log10(lo.density));
      const f = lo.factor + t * (hi.factor - lo.factor);
      return Math.min(DENSITY_CORRECTION_MAX_FACTOR, Math.max(DENSITY_CORRECTION_MIN_FACTOR, f));
    }

    // ----- 集計（軽量な数値集計。townVisitUnits×世帯数/配布数(実績)から再計算） -----
    // 住所コード（CSV）モード: townDeliveryStatsはtown.codeキーのまま住所コード欄のリストに表示
    // 境界設定モード: 町丁目単位の結果をcityKeyByTownCodeで市区町村単位へロールアップして境界設定欄のリストに表示
    async function aggregateTownStats() {
      const areaByCode = computeTownAreaByCode();
      const stats = {};
      if (boundaryFeatureCount > 0) {
        if (csvMode) {
          // CSVの各行が指すKEY_CODEをmatchCodeで解決する（applyCSVFilterの描画対象選定と同じく最初に一致した1件のみを採用）
          // 町丁目数×境界フィーチャ数のマッチングは件数が多いと重くなるため、定期的にUIへ制御を戻す
          let processed = 0;
          for (const town of csvTowns) {
            let matchedCode = null;
            for (const code of Object.keys(allFeaturesByCode)) {
              if (matchCode(town.code, code)) { matchedCode = code; break; }
            }
            if (matchedCode !== null) {
              const distCount = town.distributionCount || 0;
              // 統計上世帯数は住所コードデータの列ではなく、境界shapefileのSETAIプロパティから取得する
              // （住所コードデータに世帯数の列が無くても表示できるようにするため）
              const households = townSetaiByCode[matchedCode] || 0;
              // 世帯密度（世帯数÷ポリゴン面積）に応じて推定配布数を補正する
              // （複数軒が1クラスタに圧縮される密集地は過小、1軒ごとに最低1クラスタ保証される過疎地は過大に出る傾向を補う）
              const areaKm2 = (areaByCode[matchedCode] || 0) / 1e6;
              const density = areaKm2 > 0 ? households / areaKm2 : 0;
              const visits = Math.round((townVisitUnits[matchedCode] || 0) * densityCorrectionFactor(density));
              // 配布率は100%でキャップせず実数のまま保持する（UI表示側でformatRateにより100%キャップする。
              // CSVエクスポートは密度補正カーブ校正用の生データなのでキャップしない）
              // CSVの配布数（実績）が無い場合は世帯数按分による割合にフォールバックする
              const rate = distCount > 0
                ? (visits / distCount) * 100
                : (households > 0 ? (visits / households) * 100 : 0);
              stats[town.code] = { households, visits, rate };
            }
            processed++;
            if (processed % 10 === 0) await yieldToUI();
          }
        } else {
          // 境界設定モード: KEY_CODEそのままの粒度（SETAIも同じ粒度で取得済み）
          let processed = 0;
          for (const code in cityKeyByTownCode) {
            const households = townSetaiByCode[code] || 0;
            const areaKm2 = (areaByCode[code] || 0) / 1e6;
            const density = areaKm2 > 0 ? households / areaKm2 : 0;
            const visits = Math.round((townVisitUnits[code] || 0) * densityCorrectionFactor(density));
            if (visits !== 0 || households !== 0) {
              const rate = households > 0 ? (visits / households) * 100 : 0;
              stats[code] = { households, visits, rate };
            }
            processed++;
            if (processed % 50 === 0) await yieldToUI();
          }
        }
      }
      townDeliveryStats = stats;

      const cstats = {};
      if (!csvMode) {
        for (const code in stats) {
          const cityKey = cityKeyByTownCode[code];
          if (!cityKey) continue;
          if (!cstats[cityKey]) cstats[cityKey] = { households: 0, visits: 0 };
          cstats[cityKey].households += stats[code].households;
          cstats[cityKey].visits += stats[code].visits;
        }
        for (const key in cstats) {
          cstats[key].visits = Math.round(cstats[key].visits);
          cstats[key].rate = cstats[key].households > 0
            ? (cstats[key].visits / cstats[key].households) * 100
            : 0;
        }
      }
      cityDeliveryStats = cstats;

      // 集計結果が無ければ推定配布率ヒートマップのボタンを隠し、表示中なら自動でOFFにする
      // （statsはGPS実績が0でも住所コード・境界データが一致しただけで作られるため、
      // 　「実際にGPSから推定訪問数が算出できたか」を示すtownVisitUnitsの有無で判定する）
      const hasRateData = Object.keys(townVisitUnits).length > 0;
      const rateBtn = document.getElementById('rateHeatmapToggleBtn');
      if (rateBtn) {
        rateBtn.style.display = hasRateData ? '' : 'none';
        if (!hasRateData && rateHeatmapVisible) rateBtn.classList.remove('active');
      }
      // CSVモード（住所コード読み込み）で実績配布数と統計が揃っている場合のみ、密度補正カーブ校正用のエクスポートボタンを出す
      const exportActions = document.getElementById('townStatsExportActions');
      if (exportActions) exportActions.style.display = (csvMode && hasRateData) ? '' : 'none';
      // 集計結果が初めて得られたときだけ自動的にヒートマップをONにする（以降はユーザーの手動操作を尊重する）
      if (hasRateData && !rateAutoShown) {
        rateHeatmapVisible = true;
        rateAutoShown = true;
        if (rateBtn) rateBtn.classList.add('active');
      }
      if (!hasRateData) { rateHeatmapVisible = false; rateAutoShown = false; }

      applyBoundaryColorStyle();
      if (csvMode) updateTownList(); else if (boundaryLevel === 'pref') renderPrefStage(); else updateCityList();
    }

    // 町丁目KEY_CODE → ポリゴン面積(m^2、同一コードの飛び地は合算)。密度補正カーブの校正用エクスポートでのみ使う
    function computeTownAreaByCode() {
      const areaByCode = {};
      if (typeof turf === 'undefined') return areaByCode;
      for (const [code, features] of Object.entries(allFeaturesByCode)) {
        let total = 0;
        for (const f of features) {
          if (!f.geometry) continue;
          try { total += turf.area(f); } catch (e) { /* 不正なジオメトリはスキップ */ }
        }
        areaByCode[code] = total;
      }
      return areaByCode;
    }

    // 町丁目別の世帯数・実績配布数・推定配布数・面積・世帯密度をCSVでダウンロードする。
    // 充足率ヒートマップの密度バイアス（マンション等の高密度地区で推定配布数が過小に出る傾向）を
    // 実データで検証・補正カーブ校正するための元データとして使う
    function exportTownStatsCSV() {
      if (!csvTowns.length) return;
      const areaByCode = computeTownAreaByCode();
      const rows = [['住所コード', '都道府県', '市区町村', '町丁目名', '統計上世帯数', '配布数(実績)', '推定配布数', '充足率(%)', '面積(km2)', '世帯密度(戸/km2)']];
      for (const town of csvTowns) {
        const stat = townDeliveryStats[town.code];
        const households = stat ? stat.households : 0;
        const visits = stat ? Math.round(stat.visits) : '';
        const rate = stat && stat.households > 0 ? stat.rate.toFixed(1) : '';
        const areaKm2 = (areaByCode[town.code] || 0) / 1e6;
        const density = areaKm2 > 0 ? Math.round(households / areaKm2) : '';
        rows.push([
          town.code, town.prefName, town.cityName, town.townName,
          households || '', town.distributionCount || '', visits, rate,
          areaKm2 ? areaKm2.toFixed(4) : '', density,
        ]);
      }
      const csv = rows.map(r => r.map(v => {
        const s = String(v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',')).join('\r\n');
      const blob = new Blob([String.fromCharCode(0xFEFF) + csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '町丁目別配布データ.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    // ===== CSVレポート =====

    function parseCSVLine(line) {
      const cols = [];
      let inQuote = false, cur = '';
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQuote = !inQuote; }
        else if (ch === ',' && !inQuote) { cols.push(cur); cur = ''; }
        else { cur += ch; }
      }
      cols.push(cur);
      return cols;
    }

    function matchCode(csvCode, keyCode) {
      csvCode = String(csvCode).trim();
      keyCode = String(keyCode || '').trim();
      if (!csvCode || !keyCode) return false;
      if (csvCode === keyCode) return true;
      if (keyCode.startsWith(csvCode)) return true;
      if (csvCode.length >= 5 && keyCode.length >= 5 &&
        csvCode.slice(0, 5) === keyCode.slice(0, 5)) {
        return parseInt(csvCode.slice(5), 10) === parseInt(keyCode.slice(5), 10);
      }
      return false;
    }

    // 「配布数」列は住所コード等の固定列（1〜5）と異なりCSVごとに位置が変わりうるため、
    // ヘッダー名から自動判別できない場合はユーザーに列を選ばせる
    const CSV_FIXED_COL_INDEXES = [1, 2, 3, 4, 5]; // code, prefName, cityName, townName, (旧統計上世帯数列、現在は境界データのSETAIを参照するため未使用)
    const CSV_PICK_CANCELLED = Symbol('csv-pick-cancelled');

    function autoDetectDistributionColIdx(headerCols) {
      // 列名が完全に「配布数」と一致する列があれば最優先で採用する
      for (let idx = 0; idx < headerCols.length; idx++) {
        if (CSV_FIXED_COL_INDEXES.includes(idx)) continue;
        if ((headerCols[idx] || '').trim() === '配布数') return idx;
      }
      const candidates = [];
      headerCols.forEach((h, idx) => {
        if (CSV_FIXED_COL_INDEXES.includes(idx)) return;
        const name = (h || '').trim();
        if (name && name.includes('配布') && !name.includes('率')) candidates.push(idx);
      });
      return candidates.length === 1 ? candidates[0] : -1;
    }

    // 配布数列をユーザーに選択させるモーダルを表示し、選択された列インデックスを返す
    // （キャンセル時はCSV_PICK_CANCELLEDをthrow）
    function pickDistributionColumn(headerCols, sampleCols) {
      return new Promise((resolve, reject) => {
        const modal = document.getElementById('colPickModal');
        const list = document.getElementById('colPickList');
        const cancelBtn = document.getElementById('colPickCancelBtn');
        list.innerHTML = '';

        headerCols.forEach((h, idx) => {
          if (CSV_FIXED_COL_INDEXES.includes(idx)) return;
          const name = (h || '').trim();
          const sample = (sampleCols[idx] || '').trim();
          if (!name && !sample) return;
          const row = document.createElement('div');
          row.className = 'cp-row';
          row.innerHTML =
            `<span class="cp-idx">${idx + 1}</span>` +
            `<span class="cp-head">${name || '(無題)'}</span>` +
            `<span class="cp-sample">${sample}</span>`;
          row.addEventListener('click', () => { cleanup(); resolve(idx); });
          list.appendChild(row);
        });

        const noneRow = document.createElement('div');
        noneRow.className = 'cp-row cp-none';
        noneRow.textContent = '配布数の列は無い（0件として扱う）';
        noneRow.addEventListener('click', () => { cleanup(); resolve(-1); });
        list.appendChild(noneRow);

        function onCancel() { cleanup(); reject(CSV_PICK_CANCELLED); }
        function cleanup() {
          modal.classList.remove('show');
          cancelBtn.removeEventListener('click', onCancel);
        }
        cancelBtn.addEventListener('click', onCancel);
        modal.classList.add('show');
      });
    }

    async function loadCSVReport(file) {
      const btn = document.getElementById('csvReportBtn');
      btn.style.pointerEvents = 'none';
      btn.textContent = '⏳ 読み込み中...';
      btn.classList.remove('active');

      // この関数内で住所コードに紐づく境界データを自動fetchし終えるまでの間、
      // ✕ボタンで途中解除されると自動fetchの結果が解除後に遅れて反映される競合状態になるため、
      // 処理完了までは✕ボタンを操作不可にする
      const csvClearBtn = document.getElementById('csvReportClearBtn');
      csvClearBtn.style.pointerEvents = 'none';

      try {
        const buf = await file.arrayBuffer();
        const text = decodeBytesAuto(new Uint8Array(buf));
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (lines.length < 2) throw new Error('データが見つかりません');

        const headerCols = parseCSVLine(lines[0]);
        const firstDataCols = parseCSVLine(lines[1]);
        let distColIdx = autoDetectDistributionColIdx(headerCols);
        if (distColIdx === -1 && headerCols.length > CSV_FIXED_COL_INDEXES.length + 1) {
          // 自動判別できず、かつ配布数らしき候補列が存在しうる場合のみ選択を求める
          try {
            distColIdx = await pickDistributionColumn(headerCols, firstDataCols);
          } catch (e) {
            if (e === CSV_PICK_CANCELLED) { btn.textContent = '📊 住所コード読み込み'; return; }
            throw e;
          }
        }

        // 追加読み込み時は既存の町丁目コードと重複する行を無視し、csvTownsに合流させる
        const existingCodes = new Set(csvTowns.map(t => t.code));
        const newTowns = [];
        const seenCodes = new Set();
        for (let i = 1; i < lines.length; i++) {
          const cols = parseCSVLine(lines[i]);
          const code = (cols[1] || '').trim();
          const prefName = (cols[2] || '').trim();
          const cityName = (cols[3] || '').trim();
          const townName = (cols[4] || '').trim();
          const distributionCount = distColIdx >= 0 ? (parseInt((cols[distColIdx] || '').replace(/,/g, ''), 10) || 0) : 0;
          if (code && /^\d+$/.test(code) && !seenCodes.has(code) && !existingCodes.has(code)) {
            seenCodes.add(code);
            newTowns.push({ code, prefName, cityName, townName, distributionCount });
          }
        }
        if (!newTowns.length && !csvTowns.length) throw new Error('有効な住所コードが見つかりません');

        if (!csvMode) {
          // 初回読み込み時のみ既存の町丁目/市区町村レイヤーをクリアする（追加読み込み時は残す）
          Object.values(townLayers).forEach(g => { if (map.hasLayer(g)) map.removeLayer(g); });
          Object.values(cityGroups).forEach(g => { if (map.hasLayer(g)) map.removeLayer(g); });
          townLayers = {};
        }

        csvTowns = csvTowns.concat(newTowns);
        csvMode = true;
        townFilterText = '';
        newTowns.forEach(t => { townVisibility[t.code] = true; });

        // UIをCSVモードに切り替え（ヘッダーの列構成はupdateTownList内で組み立てる）
        document.getElementById('boundarySectionTitle').textContent = '住所コード';
        document.getElementById('cityFilterInput').placeholder = '町丁目名で絞り込み';
        document.getElementById('cityFilterInput').value = '';
        boundaryLevel = 'town';
        townStageFromCSV = true;

        // 住所コードから都道府県コードを判定し、県内全市区町村のジオメトリが未取得なら自動取得する
        // （ユーザーが先に境界データを読み込んでおく必要をなくす。confirm確認は自動処理では出さない。
        // 一覧だけ読み込み済み・一部市区町村だけトグルON済みの県も対象に含める必要があるため、
        // loadedPrefCodesではなくfullyFetchedPrefCodesで判定する）
        const neededPrefCodes = [...new Set(newTowns.map(t => t.code.slice(0, 2)))]
          .filter(c => /^\d{2}$/.test(c) && !fullyFetchedPrefCodes.has(c));
        if (neededPrefCodes.length) {
          csvBoundaryFetchInProgress = true;
          updateTownList();
        }
        try {
          for (const prefCode of neededPrefCodes) {
            await loadPrefectureByCode(prefCode, { auto: true });
          }
        } finally {
          csvBoundaryFetchInProgress = false;
        }

        if (Object.keys(allFeaturesByCode).length > 0) {
          applyCSVFilter();
        } else {
          updateTownList();
        }

        document.getElementById('csvReportGroup').classList.add('loaded');
        btn.textContent = '📊 住所コード読み込み';
        btn.classList.add('active');
        updateBoundaryStepper();

        // 対象範囲が実際に増えた場合のみ再集計する
        // （同じCSVを重複読込した場合など、新規追加が無ければ無駄な再計算をスキップする）
        if (newTowns.length) {
          computeVisitEstimates();
        }
      } catch (e) {
        console.error(e);
        alert(`CSVの読み込みに失敗しました。\n${e.message}`);
        btn.textContent = '📊 住所コード読み込み';
      } finally {
        btn.style.pointerEvents = '';
        csvClearBtn.style.pointerEvents = '';
      }
    }

    async function clearCSVReport() {
      if (!confirm('住所コードの読み込みをキャンセルしますか？')) return;

      teardownTownStage();
      if (Object.keys(cityNames).length > 0) {
        await enterCityStage();
      } else {
        enterPrefStage();
      }

      // 住所コード解除で集計の対象範囲(粒度)が変わるため再集計する
      computeVisitEstimates();
    }

    // csvMode中に都道府県を複数取得すると、都道府県ごとにこの関数が呼ばれるため
    // await無しで多重に(重複して)実行されることがある。世代カウンタで「後から呼ばれた
    // 実行だけが最後まで走る」ようにし、古い実行は自分がaddToMapしたレイヤーがtownLayers
    // から見えなくなる（＝解除不能な迷子レイヤーになる）前に自ら中断する。
    let csvFilterGeneration = 0;
    // 既にtownLayersにある町丁目はここでは触らない（表示状態を保ったまま、追加読込で増えた
    // 新規の町丁目分だけレイヤーを組み立てる）。CSV読込のやり直し等で完全に作り直したい場合は
    // 呼び出し側（teardownTownStage等）がtownLayersを空にしてから呼ぶこと。
    async function applyCSVFilter() {
      const myGen = ++csvFilterGeneration;

      // あいまい一致（桁のずれ吸収）が必要な場合だけのフォールバック用。ループの外で1回だけ作る
      // （町丁目ごとに全件を作り直すと件数の掛け算で著しく遅くなるため）
      const allEntries = Object.entries(allFeaturesByCode);

      let processed = 0;
      for (const town of csvTowns) {
        if (myGen !== csvFilterGeneration) return; // 新しい呼び出しに引き継がれたため中断
        if (townLayers[town.code]) continue; // 構築済みの町丁目は表示状態を保ったまま維持する

        // 住所コードは境界データのKEY_CODEとほぼ完全一致するため、まず直接引き（O(1)）を試す。
        // 見つからない場合のみ、桁のずれ等を吸収するあいまい一致に総当たりでフォールバックする
        let matched = allFeaturesByCode[town.code];
        if (!matched) {
          matched = [];
          for (const [code, features] of allEntries) {
            if (matchCode(town.code, code)) { matched = features; break; }
          }
        }
        if (!matched.length) continue;

        // buildCityGeoJSONLayerと同様、フィーチャ単位ではなくレイヤーグループ単位でホバーイベントを
        // 受ける（②のイベント一括化。1町丁目あたりのフィーチャ数は通常少ないが、統一しておく）
        const townStyle = () => boundaryStyleFor(town.code);
        const layer = L.geoJSON({ type: 'FeatureCollection', features: matched }, {
          style: townStyle, pane: 'boundaryPane', renderer: boundaryCanvasRenderer,
        });
        const labelOf = p => [p.CITY_NAME, p.S_NAME].filter(Boolean).join(' ') || p.name || town.townName || '';
        layer.on('mouseover', e => {
          const lyr = e.layer;
          const label = labelOf(lyr.feature?.properties || {});
          if (label && !anyTrackVisible()) {
            _balloonLocked = true;
            showBalloon(null, label, boundaryFeatureStatDetail(town.code), e.originalEvent.clientX, e.originalEvent.clientY, 'cursor', true);
          }
          lyr.setStyle({ fillOpacity: Math.min(1, cityFillOpacity + 0.25), weight: 2.5 });
        });
        layer.on('mousemove', e => {
          const lyr = e.layer;
          const label = labelOf(lyr.feature?.properties || {});
          if (!label || anyTrackVisible()) return;
          showBalloon(null, label, boundaryFeatureStatDetail(town.code), e.originalEvent.clientX, e.originalEvent.clientY, 'cursor', true);
        });
        layer.on('mouseout', e => {
          const lyr = e.layer;
          if (labelOf(lyr.feature?.properties || {})) hideBalloon();
          layer.resetStyle(lyr);
        });
        townLayers[town.code] = layer;
        if (townVisibility[town.code]) layer.addTo(map);

        processed++;
        if (processed % 5 === 0) await yieldToUI();
      }

      if (myGen !== csvFilterGeneration) return;
      updateTownList();
    }

    function updateTownList() {
      const hdr = document.getElementById('cityListHeader');
      const el = document.getElementById('cityList');
      el.innerHTML = '';

      const showStats = boundaryFeatureCount > 0;
      hdr.innerHTML =
        '<div class="h-toggle"></div>' +
        '<span class="h-name">町丁目名</span>' +
        '<span class="h-stat">統計上<br>世帯数</span>' +
        '<span class="h-stat">配布数<br>(実績)</span>' +
        (showStats ? '<span class="h-stat">推定<br>配布数</span><span class="h-stat">充足<br>率</span>' : '');
      hdr.style.display = 'flex';

      if (Object.keys(allFeaturesByCode).length === 0) {
        el.innerHTML = csvBoundaryFetchInProgress
          ? '<div style="padding:12px;font-size:11px;color:var(--text-muted);text-align:center">境界データを読み込み中...</div>'
          : '<div style="padding:12px;font-size:11px;color:var(--text-muted);text-align:center">境界データの自動取得に失敗しました。インターネット接続を確認してください</div>';
        document.getElementById('cityCount').textContent = `${csvTowns.length}件`;
        updateBoundaryStepper();
        return;
      }

      const matchedCount = csvTowns.filter(t => townLayers[t.code]).length;
      document.getElementById('cityCount').textContent = `${matchedCount}/${csvTowns.length}件`;

      const q = townFilterText.toLowerCase().replace(/\s+/g, '');
      const filtered = csvTowns.filter(t => townMatchesFilter(t, q));

      if (showStats && Object.keys(townDeliveryStats).length) {
        // 配布率の低い順（未計算・統計上世帯数0の町丁目は末尾）に並べ替える
        filtered.sort((a, b) => {
          const sa = townDeliveryStats[a.code], sb = townDeliveryStats[b.code];
          const ra = (sa && sa.households > 0) ? sa.rate : null;
          const rb = (sb && sb.households > 0) ? sb.rate : null;
          if (ra == null && rb == null) return 0;
          if (ra == null) return 1;
          if (rb == null) return -1;
          return ra - rb;
        });
      }

      filtered.forEach(town => {
        const hasLayer = !!townLayers[town.code];
        const on = hasLayer && townVisibility[town.code];
        const row = document.createElement('div');
        row.className = 'city-row' + (!hasLayer ? ' grayed' : '');

        const tog = document.createElement('div');
        tog.className = 'city-toggle' + (on ? ' on' : '');
        if (hasLayer) {
          tog.addEventListener('click', e => { e.stopPropagation(); toggleTown(town.code, !townVisibility[town.code]); });
        }

        const nm = document.createElement('span');
        nm.className = 'city-name';
        nm.innerHTML = (town.cityName ? `<span style="font-size:9px;color:var(--text-muted);margin-right:3px">${town.cityName}</span>` : '')
          + (town.townName || town.code);

        const ms = townDeliveryStats[town.code];

        const st = document.createElement('span');
        st.className = 'city-stat';
        st.title = '統計上世帯数（境界データのSETAIを参照）';
        st.textContent = ms && ms.households > 0 ? ms.households.toLocaleString() : '—';

        const dl = document.createElement('span');
        dl.className = 'city-stat';
        dl.title = '配布数（実績）';
        dl.textContent = town.distributionCount > 0 ? town.distributionCount.toLocaleString() : '—';

        row.appendChild(tog);
        row.appendChild(nm);
        row.appendChild(st);
        row.appendChild(dl);

        if (showStats) {
          const hasHouseholds = ms && ms.households > 0;
          const vs = document.createElement('span');
          vs.className = 'city-stat';
          vs.title = 'GPS滞在クラスタのポイント・イン・ポリゴン集計による推定配布数';
          vs.textContent = hasHouseholds ? ms.visits.toLocaleString() : '—';

          const rt = document.createElement('span');
          rt.className = 'city-stat rate';
          rt.title = 'GPS滞在クラスタのポイント・イン・ポリゴン集計による推定配布数の、配布数(実績)に対する割合';
          rt.textContent = hasHouseholds ? formatRate(ms.rate) : '—';

          row.appendChild(vs);
          row.appendChild(rt);
        }

        if (hasLayer) row.addEventListener('click', () => toggleTown(town.code, !townVisibility[town.code]));
        el.appendChild(row);
      });

      if (!el.children.length)
        el.innerHTML = '<div style="padding:8px 12px;font-size:11px;color:var(--text-muted)">該当なし</div>';

      updateBoundaryStepper();
    }

    function toggleTown(code, show) {
      townVisibility[code] = show;
      const g = townLayers[code];
      if (!g) return;
      if (show && !map.hasLayer(g)) {
        g.addTo(map);
        const b = g.getBounds();
        if (b.isValid()) map.fitBounds(b, { padding: [40, 40], maxZoom: 17, animate: false });
      }
      else if (!show && map.hasLayer(g)) map.removeLayer(g);
      updateTownList();
    }

    // 町丁目一覧の絞り込み条件（townFilterText）に一致するかどうかを判定する（bulkTownVisibilityと共用）
    function townMatchesFilter(t, q) {
      if (!q) return true;
      const searchText = `${t.prefName}${t.cityName}${t.townName}`.toLowerCase().replace(/\s+/g, '');
      return searchText.includes(q);
    }

    // 「全て表示/全て非表示」は、現在の絞り込み（townFilterText）に一致する行だけを対象にする
    // （絞り込みで隠れている町丁目の表示状態は変えない）
    function bulkTownVisibility(show) {
      const q = townFilterText.toLowerCase().replace(/\s+/g, '');
      csvTowns.forEach(town => {
        if (!townMatchesFilter(town, q)) return;
        townVisibility[town.code] = show;
        const g = townLayers[town.code];
        if (!g) return;
        if (show && !map.hasLayer(g)) g.addTo(map);
        else if (!show && map.hasLayer(g)) map.removeLayer(g);
      });
      updateTownList();
    }

    function onTownFilter(val) { townFilterText = val; updateTownList(); }

    // ===== 情報吹き出し（自作div・全種類共通） =====
    const HOVER_PX = 8;    // ヒット半径（ピクセル）
    const MIN_ZOOM_HOVER = 13;  // このズーム未満は無効
    const MAP_TOP_MARGIN = 30;  // 地図上端からこの範囲内はヘッダーと重なるため吹き出しを出さない

    const hoverTip = document.getElementById('hover-tooltip');
    const htLabel = hoverTip.querySelector('.ht-label');
    const htTime = hoverTip.querySelector('.ht-time');
    let _hoverRaf = null;
    let _lastHoverE = null;
    let _balloonLocked = false;    // マーカー/町丁目ホバー表示中はtrue（軌跡ホバーを抑止）

    function fmtTime(ms) {
      if (!ms) return '日時不明';
      const d = new Date(ms);
      const z = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${z(d.getMonth() + 1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
    }

    function fmtDuration(ms) {
      const totalMin = Math.round(ms / 60000);
      const h = Math.floor(totalMin / 60), m = totalMin % 60;
      if (h > 0) return m > 0 ? `${h}時間${m}分` : `${h}時間`;
      return `${m}分`;
    }

    // idxの点に到達する直前の区間速度（無ければ次の区間で代用、両方無効なら null）
    function nearestSpeed(key, idx) {
      const speeds = GPX_SPEEDS[key];
      if (!speeds) return null;
      if (idx > 0 && speeds[idx - 1] >= 0) return speeds[idx - 1];
      if (idx < speeds.length && speeds[idx] >= 0) return speeds[idx];
      return null;
    }

    function fmtSpeed(kmh) {
      return kmh == null ? '—' : `${kmh.toFixed(1)} km/h`;
    }

    // マーカーの地図座標をビューポート基準の画面座標に変換
    function markerScreenPos(marker) {
      const pt = map.latLngToContainerPoint(marker.getLatLng());
      const rect = map.getContainer().getBoundingClientRect();
      return { x: rect.left + pt.x, y: rect.top + pt.y };
    }

    // anchor: 'cursor'（カーソル右上）| 'top'（指定座標の真上中央）
    function positionBalloon(x, y, anchor) {
      hoverTip.style.visibility = 'hidden';
      hoverTip.style.display = 'block';
      const tw = hoverTip.offsetWidth, th = hoverTip.offsetHeight;
      let nx, ny;
      if (anchor === 'top') {
        nx = x - tw / 2;
        ny = y - th - 14;
        if (ny < 6) ny = y + 14;
      } else {
        nx = x + 14;
        ny = y - th - 8;
        if (nx + tw > window.innerWidth) nx = x - tw - 14;
        if (ny < 6) ny = y + 14;
      }
      nx = Math.max(4, Math.min(nx, window.innerWidth - tw - 4));
      hoverTip.style.left = nx + 'px';
      hoverTip.style.top = ny + 'px';
      hoverTip.style.visibility = '';
    }

    // color: 端末色（nullなら無着色）, detailHtml: 2行目（空文字なら非表示）
    // subtle: trueなら控えめな見た目にする（境界ポリゴンの町字名など、あくまで参考情報の表示用）
    function showBalloon(color, label, detailHtml, x, y, anchor, subtle) {
      // カーソルが地図上端付近にあると吹き出しがヘッダーに重なってしまうため表示しない
      const mapTop = map.getContainer().getBoundingClientRect().top;
      if (y - mapTop < MAP_TOP_MARGIN) { hoverTip.style.display = 'none'; return; }
      hoverTip.classList.toggle('ht-subtle', !!subtle);
      htLabel.style.color = color || '';
      htLabel.textContent = label;
      htTime.innerHTML = detailHtml || '';
      htTime.style.display = detailHtml ? '' : 'none';
      positionBalloon(x, y, anchor);
    }

    function hideBalloon() {
      hoverTip.style.display = 'none';
      _balloonLocked = false;
    }

    function doHoverSearch(e) {
      if (_balloonLocked) return;
      // 表示中のGPX軌跡が無ければ探すものが無いので何もしない（hideBalloon()を呼ぶと、
      // 境界ポリゴン側が表示した町字名の吹き出しを毎フレーム消してしまう競合が起きるため）
      if (!anyTrackVisible()) return;
      if (map.getZoom() < MIN_ZOOM_HOVER) { hideBalloon(); return; }

      const mp = e.containerPoint;
      // 地図上端付近（ヘッダーと重なる範囲）は検索自体を省略する
      if (mp.y < MAP_TOP_MARGIN) { hideBalloon(); return; }
      const ll0 = map.containerPointToLatLng(mp);
      const ll1 = map.containerPointToLatLng([mp.x + HOVER_PX, mp.y + HOVER_PX]);
      const latTol = Math.abs(ll1.lat - ll0.lat);
      const lonTol = Math.abs(ll1.lng - ll0.lng);
      const mLat = ll0.lat, mLon = ll0.lng;

      let best = null, bestDist = HOVER_PX + 1;

      for (let di = 0; di < DEVICES.length; di++) {
        const dev = DEVICES[di];
        if (!visibility[dev.key]) continue;
        const coords = GPX_DATA[dev.key];
        if (!coords) continue;
        for (let i = 0; i < coords.length; i++) {
          const lat = coords[i][0], lon = coords[i][1];
          // lat/lon バウンディングボックスで大半を除外（高速）
          if (lat < mLat - latTol || lat > mLat + latTol) continue;
          if (lon < mLon - lonTol || lon > mLon + lonTol) continue;
          // 通過した点のみピクセル距離を計算
          const px = map.latLngToContainerPoint([lat, lon]);
          const dist = Math.hypot(px.x - mp.x, px.y - mp.y);
          if (dist < bestDist) { bestDist = dist; best = { dev, time: coords[i][2], idx: i, coords }; }
        }
      }

      if (best) {
        const oe = e.originalEvent;
        const label = best.dev.rawLabel || (best.dev.company ? `${best.dev.company} ${best.dev.model}` : best.dev.model);
        // 間引き表示中（サンプリングレート>1）は2点間の実距離が不明瞭になり速度の信頼性が低いため非表示
        const showSpeed = getSampleRate(map.getZoom()) === 1;
        const detail = showSpeed
          ? `${fmtTime(best.time)}<br>${fmtSpeed(nearestSpeed(best.dev.key, best.idx))}`
          : fmtTime(best.time);
        showBalloon(best.dev.color, label, detail, oe.clientX, oe.clientY, 'cursor');
      } else {
        hideBalloon();
      }
    }

    map.on('mousemove', e => {
      _lastHoverE = e;
      if (_hoverRaf) return;
      _hoverRaf = requestAnimationFrame(() => { _hoverRaf = null; doHoverSearch(_lastHoverE); });
    });
    map.on('mouseout', hideBalloon);
    map.on('dragstart', hideBalloon);
    map.on('zoomstart', hideBalloon);

    // NominatimのaddressDetails(a)・display_nameから都道府県・市区町村名を抽出する共通処理。
    // 政令指定都市の区はaddress.suburbに入る（東京23区はaddress.cityに入るため対象外）
    function extractPrefAndCityFromAddress(a, displayName) {
      let pref = '';
      if (a.state && /[都道府県]$/.test(a.state)) {
        pref = a.state;
      } else if (a.province && /[都道府県]$/.test(a.province)) {
        pref = a.province;
      } else {
        const dnParts = (displayName || '').split(',').map(s => s.trim());
        pref = dnParts.find(s => /[都道府県]$/.test(s)) || a.state || a.province || '';
      }
      const ward = (a.suburb && /区$/.test(a.suburb)) ? a.suburb : '';
      const cityArr = [a.city, a.city_district, a.county, a.town, a.village, ward]
        .filter(s => s && s !== pref && !/[都道府県]$/.test(s));
      const city = [...new Set(cityArr)].join('');
      return { pref, city, ward };
    }

    // ===== クリック位置の住所表示 =====
    // 都道府県・市区町村 → Nominatim、町丁目 → 国土地理院
    let _geoAbort = null;
    map.on('click', async e => {
      const disp = document.getElementById('locationDisplay');
      disp.textContent = '取得中…';
      if (_geoAbort) _geoAbort.abort();
      const ctrl = new AbortController();
      _geoAbort = ctrl;
      const { lat, lng } = e.latlng;
      try {
        const [nomRes, gsiRes] = await Promise.all([
          fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ja`, { signal: ctrl.signal }),
          fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${lat}&lon=${lng}`, { signal: ctrl.signal }),
        ]);
        const [nomJson, gsiJson] = await Promise.all([nomRes.json(), gsiRes.json()]);

        const a = nomJson.address || {};
        const { pref, city, ward } = extractPrefAndCityFromAddress(a, nomJson.display_name);
        const town = gsiJson?.results?.lv01Nm || a.quarter || (ward ? '' : a.suburb) || a.neighbourhood || '';

        const parts = [pref, city, town].filter(Boolean);
        disp.textContent = parts.length ? parts.join('　') : '—';
      } catch (err) {
        if (err.name !== 'AbortError') disp.textContent = '—';

    // 検索語(rawQuery)とジオコーディングで得た市区町村名(geocodedCity)から、
    // 表示すべき市区町村（cityNamesのキー）を1件以上解決する。政令指定都市の扱いが肝:
    //   「横浜市港北区」のように区名まで入力された場合    → その区のみ
    //   「横浜市」のように親市名だけ入力された場合        → 全区をまとめて対象にする
    //   「町田市」のような区を持たない市区町村名の場合    → その市区町村のみ
    //   「横浜市港北区新横浜」のような町丁目まで含む入力  → ジオコーディング結果の市区町村名で解決
    function resolveCityKeysForQuery(rawQuery, geocodedCity) {
      const q = (rawQuery || '').trim();
      if (!q) return [];

      // 入力そのものが「〇〇市××区」形式なら、その区だけを厳密一致で探す
      if (designatedCityParent(q)) {
        const key = Object.keys(cityNames).find(k => cityNames[k] === q);
        return key ? [key] : [];
      }
      // 政令指定都市の親市名だけが入力された場合は、その市の全区を対象にする
      const wardKeys = Object.keys(cityNames).filter(k => designatedCityParent(cityNames[k]) === q);
      if (wardKeys.length) return wardKeys;
      // 通常の市区町村名として厳密一致
      const exact = Object.keys(cityNames).find(k => cityNames[k] === q);
      if (exact) return [exact];
      // ここまでで見つからなければ、より詳細な住所（町丁目等）とみなし、
      // ジオコーディングで得られた市区町村名で厳密一致→部分一致の順に探す
      if (geocodedCity) {
        const exact2 = Object.keys(cityNames).find(k => cityNames[k] === geocodedCity);
        if (exact2) return [exact2];
        const partial = Object.keys(cityNames).find(k =>
          cityNames[k].includes(geocodedCity) || geocodedCity.includes(cityNames[k]));
        if (partial) return [partial];
      }
      return [];
    }

    // 住所検索で得られた都道府県・市区町村から、該当県の境界データを（未読込なら）裏側で静かに取得し、
    // 該当する市区町村を市区町村一覧に「非表示」の状態で表示する（地図には自動描画しない）。
    // 住所コード（CSV）表示中は市区町村一覧側を差し替えないため、データの取得のみ行う。
    async function loadBoundaryForSearchQuery(rawQuery, nomResult) {
      try {
        const a = nomResult?.address || {};
        const { pref, city: geocodedCity } = extractPrefAndCityFromAddress(a, nomResult?.display_name);
        const prefCode = PREF_CODE_BY_NAME[pref];
        if (!prefCode) return;

        if (!loadedPrefCodes.has(prefCode)) {
          await loadPrefectureByCode(prefCode, { silent: true });
        }

        const keys = resolveCityKeysForQuery(rawQuery, geocodedCity);
        if (!keys.length) { console.warn('検索語に一致する市区町村の境界データが見つかりませんでした:', rawQuery); return; }

        if (csvMode) {
          console.warn('住所コード表示中のため、取得した境界データは市区町村一覧に反映していません（データ自体は読み込み済みです）');
          return;
        }

        const filterLabel = keys.length > 1 ? rawQuery.trim() : cityNames[keys[0]];
        cityFilterText = filterLabel;
        document.getElementById('cityFilterInput').value = filterLabel;
        document.getElementById('cityFilterInput').placeholder = '市区町村で絞り込み';
        document.getElementById('boundarySectionTitle').textContent = '境界設定（市区町村）';
        boundaryLevel = 'city';
        await showCityLayersPerVisibility();
        updateCityList();
      } catch (e) {
        console.error('検索語からの境界データ自動読込に失敗しました:', e);
      }
    }

    // ===== 住所検索 =====
    async function doAddressSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      const btn = document.getElementById('searchBtn');
      btn.textContent = '⏳';
      btn.style.pointerEvents = 'none';
      try {
        const isPostal = /^[\d\-]+$/.test(q);
        let searchQuery = q;
        if (isPostal) {
          const zipcode = q.replace(/-/g, '');
          const zipRes = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${encodeURIComponent(zipcode)}`);
          const zipJson = await zipRes.json();
          if (!zipJson.results?.length) { alert('該当する郵便番号が見つかりませんでした。'); return; }
          const r = zipJson.results[0];
          searchQuery = [r.address1, r.address2, r.address3].filter(Boolean).join('');
        }
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(searchQuery)}&format=json&accept-language=ja&limit=1&countrycodes=jp&addressdetails=1`;
        const res = await fetch(url);
        const json = await res.json();
        if (!json.length) { alert('該当する住所が見つかりませんでした。'); return; }
        const { lat, lon, boundingbox } = json[0];
        if (boundingbox) {
          const bounds = L.latLngBounds(
            [+boundingbox[0], +boundingbox[2]],
            [+boundingbox[1], +boundingbox[3]]
          );
          // 都道府県・市区町村など広い行政区域はboundingboxも広くなるため、
          // その場合は自然なフィットズームをそのまま使う（下限16でクランプしない）。
          // 個別の住所・建物等の狭いboundingboxは、従来通り16〜17（street level）にクランプする
          const fitZoom = map.getBoundsZoom(bounds);
          const zoom = fitZoom <= 15 ? fitZoom : Math.min(17, Math.max(16, fitZoom));
          map.setView([+lat, +lon], zoom, { animate: false });
        } else {
          map.setView([+lat, +lon], 17, { animate: false });
        }
        await loadBoundaryForSearchQuery(searchQuery, json[0]);
      } catch (e) {
        alert('検索に失敗しました。');
      } finally {
        btn.textContent = '🔍';
        btn.style.pointerEvents = '';
      }
    }
    document.getElementById('searchInput').addEventListener('keydown', e => {

    // ===== セーブ/ロード機能 =====
    // 保存先はブラウザのIndexedDB（GitHub Pagesのリポジトリ容量は一切消費しない）。
    // URLの utm_source パラメータで名前空間を分け、異なるパラメータで開いた場合は互いのセーブデータが見えない。
    // 境界・住所コードデータ（重いポリゴン形状）はセーブごとに複製せず、内容が同一なら
    // 名前空間内で1つだけ共有キャッシュ(geoCache)として持ち、各セーブスロットはそこへの参照のみ持つ。

    const SAVE_DB_NAME = 'gpsTrackerSaves';
    const SAVE_DB_VERSION = 1;

    function getSaveNamespace() {
      return new URLSearchParams(location.search).get('utm_source') || 'default';
    }

    function openSaveDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(SAVE_DB_NAME, SAVE_DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('slots')) {
            const store = db.createObjectStore('slots', { keyPath: 'id' });
            store.createIndex('namespace', 'namespace', { unique: false });
          }
          if (!db.objectStoreNames.contains('geoCache')) {
            db.createObjectStore('geoCache', { keyPath: 'fingerprint' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function idbReq(req) {
      return new Promise((resolve, reject) => {
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbPut(storeName, value) {
      const db = await openSaveDB();
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(value);
      return new Promise((resolve, reject) => {
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbGet(storeName, key) {
      const db = await openSaveDB();
      const tx = db.transaction(storeName, 'readonly');
      return idbReq(tx.objectStore(storeName).get(key));
    }

    async function idbDelete(storeName, key) {
      const db = await openSaveDB();
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(key);
      return new Promise((resolve, reject) => {
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbGetAllByIndex(storeName, indexName, key) {
      const db = await openSaveDB();
      const tx = db.transaction(storeName, 'readonly');
      return idbReq(tx.objectStore(storeName).index(indexName).getAll(key));
    }

    async function idbGetAllKeys(storeName) {
      const db = await openSaveDB();
      const tx = db.transaction(storeName, 'readonly');
      return idbReq(tx.objectStore(storeName).getAllKeys());
    }

    async function idbGetAll(storeName) {
      const db = await openSaveDB();
      const tx = db.transaction(storeName, 'readonly');
      return idbReq(tx.objectStore(storeName).getAll());
    }

    // cyrb53系の高速ハッシュ。共有キャッシュの内容フィンガープリント用（暗号強度は不要）
    function hashString(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
    }

    // 文字列 → gzip圧縮Blob（ブラウザネイティブのCompressionStreamを使用、追加ライブラリ不要）
    async function gzipString(str) {
      const bytes = new TextEncoder().encode(str);
      const cs = new CompressionStream('gzip');
      const writer = cs.writable.getWriter();
      const writeDone = writer.write(bytes).then(() => writer.close());
      const [buf] = await Promise.all([new Response(cs.readable).arrayBuffer(), writeDone]);
      return new Blob([buf]);
    }

    async function gunzipToString(blob) {
      const ds = new DecompressionStream('gzip');
      return new Response(blob.stream().pipeThrough(ds)).text();
    }

    function slotId(namespace, name) { return `${namespace}::${name}`; }

    // 境界/住所コードデータの現在の内容をフィンガープリント化し、共有キャッシュに未登録なら登録する。
    // 同じ内容（同じ都道府県・同じ住所コードCSV）を指す限り、複数のセーブスロットが同じキャッシュ実体を共有する。
    async function computeGeoCacheEntry() {
      // 境界データ未読み込みでも住所コードCSVだけ読み込んでいる場合があるため、両方が空の時だけスキップする
      if (Object.keys(allFeaturesByCode).length === 0 && csvTowns.length === 0) return null;
      const content = {
        allFeaturesByCode, cityKeyByTownCode, townSetaiByCode,
        cityNames, cityCodes, cityPrefCodes, citySetai,
        loadedPrefCodesArr: [...loadedPrefCodes],
        autoPrefCodesArr: [...autoPrefCodes],
        boundaryFeatureCount, csvTowns,
      };
      const json = JSON.stringify(content);
      const fingerprint = hashString(json);
      const existing = await idbGet('geoCache', fingerprint);
      if (!existing) {
        const blob = await gzipString(json);
        await idbPut('geoCache', { fingerprint, blob, createdAt: Date.now() });
      }
      return fingerprint;
    }

    // どのセーブスロットからも参照されなくなった共有キャッシュを削除する（保存/削除のたびに非同期で実行）
    async function pruneUnreferencedGeoCache() {
      const allSlots = await idbGetAll('slots');
      const used = new Set(allSlots.map(s => s.geo && s.geo.fingerprint).filter(Boolean));
      const allFingerprints = await idbGetAllKeys('geoCache');
      for (const fp of allFingerprints) {
        if (!used.has(fp)) await idbDelete('geoCache', fp);
      }
    }

    // ----- 保存 -----
    async function saveToSlot(name) {
      const namespace = getSaveNamespace();
      const geoFingerprint = await computeGeoCacheEntry();
      const gpxBlob = await gzipString(JSON.stringify(GPX_DATA));

      const record = {
        id: slotId(namespace, name),
        namespace, name,
        savedAt: Date.now(),
        mapView: { lat: map.getCenter().lat, lng: map.getCenter().lng, zoom: map.getZoom(), aerialMode },
        ui: {
          sidebarW: parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w')) || 400,
          cityPaneH: parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--city-pane-h')) || 320,
          cityFillOpacityPercent: Math.round(cityFillOpacity * 100),
          filterText, cityFilterText, townFilterText, groupExpanded,
          secPerUnit, restExcludeMinutes, transitSpeedKmh,
          rateHeatmapVisible, rateAutoShown,
        },
        devices: {
          DEVICES, visibility, modelColorMap, nextColorIdx, nextDeviceSeq,
          loadedKeysArr: [...loadedKeys],
        },
        gpxBlob,
        geo: { fingerprint: geoFingerprint, cityVisibility, townVisibility, csvMode },
        sizeBytes: gpxBlob.size,
      };
      await idbPut('slots', record);
      pruneUnreferencedGeoCache(); // 完了を待たずバックグラウンドで実行
      return record;
    }

    async function listSlots() {
      const rows = await idbGetAllByIndex('slots', 'namespace', getSaveNamespace());
      return rows.sort((a, b) => b.savedAt - a.savedAt);
    }

    async function deleteSlot(name) {
      await idbDelete('slots', slotId(getSaveNamespace(), name));
      pruneUnreferencedGeoCache();
    }

    // 復元前に全状態を初期値へ戻す（clearTrackData/clearCSVReportの本体相当。
    // confirmダイアログを介さず呼べるようにするための専用実装）

      cityTownCodes = {}; cityLoadingKeys = new Set();
      townLayers = {};
      allFeaturesByCode = {};

      townSetaiByCode = {};
      loadedPrefCodes = new Set();
      autoPrefCodes = new Set();
